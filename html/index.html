<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <title>Vehicle Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toastContainer"></div>

    <div id="app" class="hidden">
      <div class="card">
        <div class="card-glow"></div>

        <div class="card-header">
          <div class="header-left">
            <div class="icon-badge">
              <span id="headerIconText">🚗</span>
            </div>
            <div class="header-text">
              <h1 id="headerTitle">Registracija Vozila</h1>
              <p id="modelText">Ucitavanje...</p>
            </div>
          </div>
          <button id="closeBtn" class="close-btn" title="Zatvori">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path
                d="M1 1L13 13M13 1L1 13"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div class="tabs" id="mainTabs">
          <button class="tab-btn active" data-tab="main">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 12l2-5.5A2 2 0 0 1 6.9 5h10.2a2 2 0 0 1 1.9 1.5L21 12M3 12v6a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h12v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-6M3 12h18"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="7" cy="16" r="1.2" fill="currentColor" />
              <circle cx="17" cy="16" r="1.2" fill="currentColor" />
            </svg>
            Registracija
          </button>
          <button class="tab-btn gold-tab" data-tab="custom">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"
              />
            </svg>
            Personalizacija
          </button>
        </div>

        <!-- ============ REGISTRACIJA TAB ============ -->
        <div class="tab-content active" id="tab-main">
          <div class="plate-wrapper">
            <div class="plate-display" id="plateDisplay">
              <span class="plate-flag">🇷🇸</span>
              <span class="plate-text">AA000AA</span>
            </div>
          </div>

          <div class="status-row">
            <span id="statusBadge" class="badge badge-none">
              <span class="badge-dot"></span>
              Nije registrovano
            </span>
            <span id="daysLeft" class="days-left"></span>
          </div>

          <div class="info-grid">
            <div class="info-box blue">
              <div class="info-icon">💵</div>
              <div class="info-text">
                <span class="label">Registracija</span>
                <span class="value" id="priceRegister">$500</span>
              </div>
            </div>
            <div class="info-box purple">
              <div class="info-icon">🔄</div>
              <div class="info-text">
                <span class="label">Obnova</span>
                <span class="value" id="priceRenew">$250</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="registerBtn" class="btn btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <path
                  d="M5 13l4 4L19 7"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Registruj vozilo
            </button>
            <button id="renewBtn" class="btn btn-secondary hidden">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 4v5h5M20 20v-5h-5M4.6 15a8 8 0 0014.4-4M19.4 9A8 8 0 005 13"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Obnovi registraciju
            </button>
          </div>

          <div class="owner-info" id="ownerInfo">
            <div class="owner-item">
              <span class="owner-label">Vlasnik</span>
              <span class="owner-value" id="ownerName">—</span>
            </div>
            <div class="owner-divider"></div>
            <div class="owner-item">
              <span class="owner-label">ID vozila</span>
              <span class="owner-value" id="vehicleId">—</span>
            </div>
          </div>
        </div>

        <!-- ============ PERSONALIZACIJA TAB ============ -->
        <div class="tab-content" id="tab-custom">
          <div class="plate-wrapper">
            <div class="plate-display premium" id="customPlatePreview">
              <span class="plate-flag">🇷🇸</span>
              <span class="plate-text">AA000AA</span>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Unesi zeljenu tablicu</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="customPlateInput"
                maxlength="8"
                placeholder="npr. VIP001"
                autocomplete="off"
              />
              <span class="input-counter" id="inputCounter">0/8</span>
            </div>
            <div class="availability-msg" id="availabilityMsg"></div>
          </div>

          <div class="info-grid">
            <div class="info-box gold">
              <div class="info-icon">⭐</div>
              <div class="info-text">
                <span class="label">Cena</span>
                <span class="value" id="priceCustom">$15,000</span>
              </div>
            </div>
            <div class="info-box cyan">
              <div class="info-icon">🔤</div>
              <div class="info-text">
                <span class="label">Karaktera</span>
                <span class="value">4 - 8</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="checkAvailabilityBtn" class="btn btn-secondary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <circle
                  cx="11"
                  cy="11"
                  r="7"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M21 21l-4.3-4.3"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Proveri
            </button>
            <button id="buyCustomBtn" class="btn btn-gold" disabled>
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9L5.7 21l1.7-7L2 9.2l7.1-.6L12 2z"
                />
              </svg>
              Kupi tablicu
            </button>
          </div>
        </div>

        <!-- ============ LOOKUP VIEW (provera - svi) ============ -->
        <div class="tab-content" id="tab-lookup">
          <div class="plate-wrapper">
            <div class="plate-display" id="lookupPlateDisplay">
              <span class="plate-flag">🇷🇸</span>
              <span class="plate-text">AA000AA</span>
            </div>
          </div>

          <div class="status-row">
            <span id="lookupStatusBadge" class="badge badge-none">
              <span class="badge-dot"></span>
              Nije registrovano
            </span>
            <span id="lookupDaysLeft" class="days-left"></span>
          </div>

          <div class="lookup-tag-row" id="lookupPersonalizedRow"></div>

          <div class="info-grid info-grid-3">
            <div class="info-box blue">
              <div class="info-icon">🚘</div>
              <div class="info-text">
                <span class="label">Model</span>
                <span class="value" id="lookupModel">—</span>
              </div>
            </div>
            <div class="info-box purple">
              <div class="info-icon">📅</div>
              <div class="info-text">
                <span class="label">Registrovano</span>
                <span class="value" id="lookupRegisteredDate">—</span>
              </div>
            </div>
            <div class="info-box cyan">
              <div class="info-icon">⏳</div>
              <div class="info-text">
                <span class="label">Vazi jos</span>
                <span class="value" id="lookupDaysBox">—</span>
              </div>
            </div>
          </div>

          <button id="closeLookupBtn" class="btn btn-secondary btn-full">
            Zatvori
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
